# Source of this file: the sfdx-hardis default template
#   https://github.com/hardisgroupcom/sfdx-hardis/blob/main/defaults/mkdocs/.github/workflows/build-deploy-docs.yml
#   raw: https://raw.githubusercontent.com/hardisgroupcom/sfdx-hardis/main/defaults/mkdocs/.github/workflows/build-deploy-docs.yml
# To upgrade it, compare it with the latest version of that template and bring in its changes,
# keeping what is specific to this project (branch names, secrets, runner tags, image, custom jobs).
# What changed between versions: https://github.com/hardisgroupcom/sfdx-hardis/blob/main/CHANGELOG.md
name: "DOC - Build and deploy with sfdx-hardis"
on:
  push:
    branches:
      - main
      - master

jobs:
  # Build & deploy docs
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Build doc with sfdx-hardis
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: yarn
      - run: yarn prepack
      - run: npm i @salesforce/cli -g
      - run: echo y|sf plugins install sfdx-hardis
      - run: sf hardis:doc:plugin:generate
      # Deploy docs with Zensical (successor of mkdocs-material, reads the same mkdocs.yml)
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: pip install zensical mdx_truly_sane_lists json-schema-for-humans ghp-import
      - run: zensical build
      # Zensical has no gh-deploy command: ghp-import is the same tool mkdocs used under the hood
      - run: |
          git config --global user.name github-actions[bot]
          git config --global user.email 41898282+github-actions[bot]@users.noreply.github.com
          ghp-import --no-jekyll --push --force --message "Deployed ${GITHUB_SHA} with Zensical" site
