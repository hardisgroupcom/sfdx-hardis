# You might add new branch names in pipeline "branches"

# Steps run in sfdx-hardis docker image, that includes Salesforce CLI and all required plugins & dependencies.
# You can use latest, beta or a version number (ex: v7.23.0), and pin a version if you need reproducible runs.
# Images are also mirrored on Docker Hub, if your infrastructure can only pull from docker.io: hardisgroupcom/sfdx-hardis-ubuntu:latest
# To use coding agents for auto-fix of deployment errors, use image ghcr.io/hardisgroupcom/sfdx-hardis-ubuntu-with-agents:latest
image: ghcr.io/hardisgroupcom/sfdx-hardis-ubuntu:latest
definitions:
  services:
    docker:
      memory: 3072

pipelines:
  # Check jobs on pull requests
  pull-requests:
    "**":
      - parallel:
          # Run MegaLinter
          - step:
              name: Run MegaLinter
              image: ghcr.io/oxsecurity/megalinter-salesforce:latest
              script:
                # The scratch org pool dashboard is a Pull Request that is never merged: nothing to lint
                - |
                  if [ "${BITBUCKET_BRANCH:-$BITBUCKET_PR_SOURCE_BRANCH}" = "sfdx-hardis/scratch-orgs-pool" ]; then
                    echo "[sfdx-hardis] Nothing to check on the scratch org pool dashboard Pull Request"
                    exit 0
                  fi
                - export DEFAULT_WORKSPACE=$BITBUCKET_CLONE_DIR && bash
                  /entrypoint.sh
              artifacts:
                - megalinter-reports/**
          # Simulate deployment
          - step:
              name: Simulate SFDX deployment
              clone:
                depth: full
              script:
                - |
                  if [ "${BITBUCKET_BRANCH:-$BITBUCKET_PR_SOURCE_BRANCH}" = "sfdx-hardis/scratch-orgs-pool" ]; then
                    echo "[sfdx-hardis] Nothing to check on the scratch org pool dashboard Pull Request"
                    exit 0
                  fi
                - export BRANCH_NAME=$(echo "$BITBUCKET_PR_DESTINATION_BRANCH" |
                  sed 's/refs\/heads\///')
                - export CI_COMMIT_REF_NAME=$BRANCH_NAME
                - export ORG_ALIAS=$BRANCH_NAME
                - export CONFIG_BRANCH=$BRANCH_NAME
                - export
                  CURRENT_BRANCH_NAME=${BITBUCKET_BRANCH:-$BITBUCKET_PR_SOURCE_BRANCH}
                - export FORCE_COLOR=1
                - export SFDX_DISABLE_FLOW_DIFF=false # Set to true to disable Flow doc during CI/CD setup
                - |
                  if [ "${CURRENT_BRANCH_NAME#auto-fix/}" != "$CURRENT_BRANCH_NAME" ]; then
                    echo "[sfdx-hardis] Skipping sf hardis commands on auto-fix branch $CURRENT_BRANCH_NAME"
                    exit 0
                  fi
                # Uncomment the lines below to allow coding agents to push auto-fix branches and create Pull Requests
                # (also requires the sfdx-hardis-ubuntu-with-agents image, an AI API key,
                # and a CI_SFDX_HARDIS_BITBUCKET_TOKEN repository variable with repository:write + pullrequest:write scopes)
                # - |
                #   if [ -n "${CI_SFDX_HARDIS_BITBUCKET_TOKEN:-}" ]; then
                #     git config user.email "sfdx-hardis-bot@cloudity.com"
                #     git config user.name "sfdx-hardis Bot"
                #     ORIGIN_PATH=$(git remote get-url origin | sed -E 's#^https?://##; s#^git@([^:]+):#\1/#; s#^ssh://git@([^/]+)/#\1/#; s#\.git$##')
                #     git remote set-url origin "https://x-token-auth:${CI_SFDX_HARDIS_BITBUCKET_TOKEN}@${ORIGIN_PATH}.git"
                #     echo "[sfdx-hardis] Bitbucket push/PR auth enabled for coding agents"
                #   fi
                - sf hardis:auth:login
                - sf hardis:project:deploy:smart --check
              artifacts:
                - hardis-report/**
          # Scratch org tests: create a scratch org (or take one from the scratch org pool), push
          # the sources and run the Apex tests on it.
          # Does nothing unless the repository variable USE_SCRATCH_ORGS is "true".
          # Variables to create: the Dev Hub authentication variables, and SFDX_HARDIS_POOL_ENCRYPTION_KEY
          # (secured) when the pool is stored in the git provider.
          # More info at https://sfdx-hardis.cloudity.com/hardis/scratch/pool/create/
          - step:
              name: Scratch org tests
              clone:
                depth: full
              script:
                - |
                  if [ "$USE_SCRATCH_ORGS" != "true" ]; then
                    echo "[sfdx-hardis] USE_SCRATCH_ORGS is not true: scratch org tests are skipped"
                    exit 0
                  fi
                - |
                  if [ "${BITBUCKET_BRANCH:-$BITBUCKET_PR_SOURCE_BRANCH}" = "sfdx-hardis/scratch-orgs-pool" ]; then
                    echo "[sfdx-hardis] Nothing to check on the scratch org pool dashboard Pull Request"
                    exit 0
                  fi
                - export
                  CURRENT_BRANCH_NAME=${BITBUCKET_BRANCH:-$BITBUCKET_PR_SOURCE_BRANCH}
                - export FORCE_COLOR=1
                - |
                  if [ "${CURRENT_BRANCH_NAME#auto-fix/}" != "$CURRENT_BRANCH_NAME" ]; then
                    echo "[sfdx-hardis] Skipping sf hardis commands on auto-fix branch $CURRENT_BRANCH_NAME"
                    exit 0
                  fi
                - sf hardis:auth:login --devhub
                - sf hardis:scratch:create
                - sleep 120 # A scratch org that was just created can be not ready yet
                - sf hardis:org:test:apex
                # Not reached when a command above failed, so the scratch org can be investigated until it expires.
                # Set the repository variable CI_DELETE_SCRATCH_ORG to "false" only to investigate issues
                - |
                  if [ "$CI_DELETE_SCRATCH_ORG" != "false" ]; then
                    sf org delete scratch --no-prompt || true
                  fi
              artifacts:
                - hardis-report/**

  # Scratch org pool refresh: deletes the scratch orgs about to expire and creates new ones.
  # Configure the pool first with sf hardis:scratch:pool:create, then schedule this pipeline every
  # night on your main branch (Pipelines -> Schedules -> New schedule -> scratch-pool-refresh)
  custom:
    scratch-pool-refresh:
      - step:
          name: Refresh scratch org pool
          clone:
            depth: full
          script:
            - export SCRATCH_ORG_POOL=true
            - export FORCE_COLOR=1
            - sf hardis:auth:login --devhub
            - sf hardis:scratch:pool:refresh
          artifacts:
            - hardis-report/**

  branches:
    # Add all your major branches here
    "{integration,uat,preprod,production,main}":
      - step:
          name: Deploy to major org
          clone:
            depth: full
          script:
            - export BRANCH_NAME=$(echo "$BITBUCKET_BRANCH" | sed
              's/refs\/heads\///')
            - export CI_COMMIT_REF_NAME=$BRANCH_NAME
            - export CONFIG_BRANCH=$BRANCH_NAME
            - export ORG_ALIAS=$BRANCH_NAME
            - export CURRENT_BRANCH_NAME=$BRANCH_NAME
            - export FORCE_COLOR=1
            - |
              if [ "${CURRENT_BRANCH_NAME#auto-fix/}" != "$CURRENT_BRANCH_NAME" ]; then
                echo "[sfdx-hardis] Skipping sf hardis commands on auto-fix branch $CURRENT_BRANCH_NAME"
                exit 0
              fi
            # Uncomment the lines below to allow coding agents to push auto-fix branches and create Pull Requests
            # (also requires the sfdx-hardis-ubuntu-with-agents image, an AI API key,
            # and a CI_SFDX_HARDIS_BITBUCKET_TOKEN repository variable with repository:write + pullrequest:write scopes)
            # - |
            #   if [ -n "${CI_SFDX_HARDIS_BITBUCKET_TOKEN:-}" ]; then
            #     git config user.email "sfdx-hardis-bot@cloudity.com"
            #     git config user.name "sfdx-hardis Bot"
            #     ORIGIN_PATH=$(git remote get-url origin | sed -E 's#^https?://##; s#^git@([^:]+):#\1/#; s#^ssh://git@([^/]+)/#\1/#; s#\.git$##')
            #     git remote set-url origin "https://x-token-auth:${CI_SFDX_HARDIS_BITBUCKET_TOKEN}@${ORIGIN_PATH}.git"
            #     echo "[sfdx-hardis] Bitbucket push/PR auth enabled for coding agents"
            #   fi
            - sf hardis:auth:login
            - sf hardis:project:deploy:smart
          artifacts:
            - hardis-report/**
