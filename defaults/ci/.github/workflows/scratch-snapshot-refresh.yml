---
# Source of this file: the sfdx-hardis default template
#   https://github.com/hardisgroupcom/sfdx-hardis/blob/main/defaults/ci/.github/workflows/scratch-snapshot-refresh.yml
#   raw: https://raw.githubusercontent.com/hardisgroupcom/sfdx-hardis/main/defaults/ci/.github/workflows/scratch-snapshot-refresh.yml
# To upgrade it, compare it with the latest version of that template and bring in its changes,
# keeping what is specific to this project (branch names, secrets, runner tags, image, custom jobs).
# What changed between versions: https://github.com/hardisgroupcom/sfdx-hardis/blob/main/CHANGELOG.md
# Scratch org snapshot refresh: on every push to a major branch that sets useScratchOrgSnapshot: true in its
# branch config, deploys the branch into an empty scratch org and takes a Dev Hub org snapshot of it.
# The scratch org job of check-deploy.yml then creates the scratch orgs of Pull Requests to that branch from
# this snapshot, and deploys only what changed since its commit.
#
# Runs only when the repository variable USE_SCRATCH_ORGS is "true"
# (Settings -> Secrets and variables -> Actions -> Variables)
#
# More info at https://sfdx-hardis.cloudity.com/hardis/scratch/snapshot/refresh/

on:
  push:
    # Add your major branches names here
    branches:
      - main
      - preprod
      - uat
      - integration
  workflow_dispatch:
permissions: read-all
name: Refresh scratch org snapshot (sfdx-hardis)

# A snapshot in progress is never cancelled: a newer push waits for it
concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  refresh_scratch_org_snapshot:
    if: ${{ vars.USE_SCRATCH_ORGS == 'true' }}
    runs-on: ubuntu-latest
    # Job timeout, in minutes: keep it above SCRATCH_ORG_SNAPSHOT_WAIT (60 by default) plus the deployment
    timeout-minutes: ${{ fromJSON(vars.CI_JOB_TIMEOUT_MINUTES || '150') }}
    # Job runs in sfdx-hardis docker image, that includes Salesforce CLI and all required plugins & dependencies.
    container: ghcr.io/hardisgroupcom/sfdx-hardis-ubuntu:latest
    name: Refresh scratch org snapshot
    permissions:
      contents: read
      actions: write # Allows starting the scratch org pool refresh workflow
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      # Set env branch variable, keeping the slashes of a branch like release/1.0
      - name: Set env.BRANCH
        run: echo "BRANCH=${GITHUB_REF#refs/heads/}" >> "$GITHUB_ENV"
      - name: Login & refresh scratch org snapshot
        id: refresh
        env:
          # Dev Hub authentication: keep the variables matching the way your Dev Hub is authenticated,
          # and replace DEVHUB by the alias of your Dev Hub
          SFDX_AUTH_URL_DEV_HUB: ${{ secrets.SFDX_AUTH_URL_DEV_HUB }}
          SFDX_CLIENT_ID_DEVHUB: ${{ secrets.SFDX_CLIENT_ID_DEVHUB }}
          SFDX_CLIENT_KEY_DEVHUB: ${{ secrets.SFDX_CLIENT_KEY_DEVHUB }}
          SCRATCH_ORG_SNAPSHOT_WAIT: ${{ vars.SCRATCH_ORG_SNAPSHOT_WAIT || '60' }}
          CI_COMMIT_REF_NAME: ${{ env.BRANCH }} # The branch whose snapshot is refreshed
          FORCE_COLOR: "1"
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sf hardis:scratch:snapshot:refresh

      # Once a new snapshot of the default branch is Active, start the pool refresh so new pool orgs start from it.
      # A project or branch without snapshots, or without scratch-pool-refresh.yml, never starts it
      - name: Start scratch org pool refresh
        if: ${{ steps.refresh.outputs.snapshot != '' && vars.SCRATCH_ORG_POOL == 'true' && github.ref_name == github.event.repository.default_branch && hashFiles('.github/workflows/scratch-pool-refresh.yml') != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body -sS -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/scratch-pool-refresh.yml/dispatches" \
            -d "{\"ref\": \"$GITHUB_REF_NAME\"}"

      - name: Archive sfdx-hardis reports
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: sfdx-hardis reports
          path: hardis-report
