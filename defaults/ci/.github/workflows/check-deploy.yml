---
# Manual updates in in job step "Login & Process Deployment" below:
# - variables for additional branches: add SFDX_CLIENT_ID / KEY variables
# - To use slack notifications, you can also define SLACK_TOKEN and SLACK_CHANNEL_ID
#   - For branch scoped messages, add SLACK_CHANNEL_ID_ + branch name (ex: SLACK_CHANNEL_ID_INTEGRATION, SLACK_CHANNEL_ID_UAT)

on:
  pull_request:
    # Add your major branches names here
    branches:
      - main
      - preprod
      - uat
      - integration
permissions: read-all
name: Simulate Deployment (sfdx-hardis)

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  check_deployment:
    runs-on: ubuntu-latest
    # Job timeout, in minutes: define the repository variable CI_JOB_TIMEOUT_MINUTES to change it.
    # Keep it above SFDX_DEPLOY_WAIT_MINUTES (120 by default) to leave room for checkout, login and the delta computation.
    timeout-minutes: ${{ fromJSON(vars.CI_JOB_TIMEOUT_MINUTES || '150') }}
    # Job runs in sfdx-hardis docker image, that includes Salesforce CLI and all required plugins & dependencies.
    # You can use latest, beta or a version number (ex: v7.23.0), and pin a version if you need reproducible runs.
    # Images are also mirrored on Docker Hub, if your infrastructure can only pull from docker.io: hardisgroupcom/sfdx-hardis-ubuntu:latest
    # To use coding agents for auto-fix of deployment errors, use image ghcr.io/hardisgroupcom/sfdx-hardis-ubuntu-with-agents:latest
    container: ghcr.io/hardisgroupcom/sfdx-hardis-ubuntu:latest
    name: Simulate Deployment to Major Org
    permissions:
      pull-requests: write # Allows sfdx-hardis to post deployment status comments on the Pull Request
      issues: write
      contents: read
      # To allow coding agents to push auto-fix branches and create Pull Requests,
      # replace "contents: read" above by "contents: write"
    steps:
      # Checkout repo
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0 # Fetch all branches
      # Login & check deploy with test classes & code coverage
      - name: Login & Simulate deployment
        if: ${{ !startsWith(github.head_ref, 'auto-fix/') &&
          !startsWith(github.ref_name, 'auto-fix/') }}
        env:
          SFDX_CLIENT_ID_INTEGRATION: ${{ secrets.SFDX_CLIENT_ID_INTEGRATION}}
          SFDX_CLIENT_KEY_INTEGRATION: ${{ secrets.SFDX_CLIENT_KEY_INTEGRATION}}
          SFDX_CLIENT_ID_UAT: ${{ secrets.SFDX_CLIENT_ID_UAT}}
          SFDX_CLIENT_KEY_UAT: ${{ secrets.SFDX_CLIENT_KEY_UAT}}
          SFDX_CLIENT_ID_PREPROD: ${{ secrets.SFDX_CLIENT_ID_PREPROD}}
          SFDX_CLIENT_KEY_PREPROD: ${{ secrets.SFDX_CLIENT_KEY_PREPROD}}
          SFDX_CLIENT_ID_MAIN: ${{ secrets.SFDX_CLIENT_ID_MAIN}}
          SFDX_CLIENT_KEY_MAIN: ${{ secrets.SFDX_CLIENT_KEY_MAIN}}
          # Secrets read by replacementRules (secret: NAME): NAME_<BRANCH> is read first, then NAME
          # PAYMENT_API_PASSWORD_UAT: ${{ secrets.PAYMENT_API_PASSWORD_UAT }}
          # PAYMENT_API_PASSWORD_MAIN: ${{ secrets.PAYMENT_API_PASSWORD_MAIN }}
          SFDX_AUTH_URL_TECHNICAL_ORG: ${{ secrets.SFDX_AUTH_URL_TECHNICAL_ORG }}
          SFDX_DEPLOY_WAIT_MINUTES: ${{ vars.SFDX_DEPLOY_WAIT_MINUTES || '120' }}
          SFDX_TEST_WAIT_MINUTES: ${{ vars.SFDX_TEST_WAIT_MINUTES || '120' }}
          CI_COMMIT_REF_NAME: ${{ github.event.pull_request.base.ref }} # Defines the target branch of the PR
          ORG_ALIAS: ${{ github.event.pull_request.base.ref }} # Defines the target branch of the PR
          CONFIG_BRANCH: ${{ github.event.pull_request.base.ref }} # Defines the target branch of the PR
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Uncomment to allow coding agents to push auto-fix branches and create Pull Requests
          # (also requires "contents: write" in the permissions above, the sfdx-hardis-ubuntu-with-agents image, and an AI API key below)
          # CI_SFDX_HARDIS_GITHUB_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_CHANNEL_ID_INTEGRATION: ${{ secrets.SLACK_CHANNEL_ID_INTEGRATION }}
          NOTIF_EMAIL_ADDRESS: ${{ secrets.NOTIF_EMAIL_ADDRESS }}
          JIRA_HOST: ${{ secrets.JIRA_HOST }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          JIRA_PAT: ${{ secrets.JIRA_PAT }}
          AHA_HOST: ${{ secrets.AHA_HOST }}
          AHA_API_KEY: ${{ secrets.AHA_API_KEY }}
          JIRA_TICKET_REGEX: ${{ secrets.JIRA_TICKET_REGEX }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Uncomment to provide API keys for coding agent auto-fix of deployment errors
          # ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Uncomment to customize coding agent behavior
          # SFDX_HARDIS_CODING_AGENT_MODEL: "sonnet" # Override the model used by the agent
          # SFDX_HARDIS_CODING_AGENT_MAX_TURNS: "30" # Limit the number of agentic turns
          FORCE_COLOR: "1"
          SFDX_DISABLE_FLOW_DIFF: false # Set to true to disable Flow doc during CI/CD
        run: |
          echo "Simulate SFDX deployment using Hardis against \"$CONFIG_BRANCH\""
          # Optional: allow coding agents to git push and create PRs (safe no-op if token is missing)
          if [ -n "${CI_SFDX_HARDIS_GITHUB_PUSH_TOKEN:-}" ]; then
            git config user.email "sfdx-hardis-bot@cloudity.com"
            git config user.name "sfdx-hardis Bot"
            GITHUB_HOST=$(echo "${GITHUB_SERVER_URL:-https://github.com}" | sed -E 's#^https?://##')
            git remote set-url origin "https://x-access-token:${CI_SFDX_HARDIS_GITHUB_PUSH_TOKEN}@${GITHUB_HOST}/${GITHUB_REPOSITORY}.git"
            echo "[sfdx-hardis] GitHub push/PR auth enabled for coding agents"
          else
            echo "[sfdx-hardis] Skipping coding-agent GitHub auth setup: CI_SFDX_HARDIS_GITHUB_PUSH_TOKEN is not set"
          fi
          # The job runs in a container, where git runs as another user than the owner of the checkout:
          # without this, git refuses the repository ("detected dubious ownership") and sfdx-hardis cannot
          # read which Pull Requests are deployed, so their deployment actions are not run
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sf hardis:auth:login
          sf hardis:project:deploy:smart --check

      # Upload sfdx-hardis reports, including the complete deployment result JSON
      - name: Archive sfdx-hardis reports
        if: always() # Also when the job was stopped by the timeout
        uses: actions/upload-artifact@v4
        with:
          name: sfdx-hardis reports
          path: hardis-report

  # Scratch org tests: create a scratch org (or take one from the scratch org pool), push the sources
  # and run the Apex tests on it.
  # Runs only when the repository variable USE_SCRATCH_ORGS is "true"
  # (Settings -> Secrets and variables -> Actions -> Variables)
  # More info at https://sfdx-hardis.cloudity.com/hardis/scratch/pool/create/
  scratch_org_tests:
    if: ${{ vars.USE_SCRATCH_ORGS == 'true' && !startsWith(github.head_ref, 'auto-fix/') }}
    runs-on: ubuntu-latest
    # Job timeout, in minutes: keep it above SFDX_TEST_WAIT_MINUTES (120 by default)
    timeout-minutes: ${{ fromJSON(vars.CI_JOB_TIMEOUT_MINUTES || '150') }}
    container: ghcr.io/hardisgroupcom/sfdx-hardis-ubuntu:latest
    name: Scratch org tests
    permissions:
      issues: write # Allows sfdx-hardis to take a scratch org from the "Scratch Orgs Pool Dashboard" issue
      pull-requests: read
      contents: read
    env:
      # Dev Hub authentication: keep the variables matching the way your Dev Hub is authenticated,
      # and replace DEVHUB by the alias of your Dev Hub
      SFDX_AUTH_URL_DEV_HUB: ${{ secrets.SFDX_AUTH_URL_DEV_HUB }}
      SFDX_CLIENT_ID_DEVHUB: ${{ secrets.SFDX_CLIENT_ID_DEVHUB }}
      SFDX_CLIENT_KEY_DEVHUB: ${{ secrets.SFDX_CLIENT_KEY_DEVHUB }}
      # Key that decrypts the scratch orgs of a pool stored in the git provider
      SFDX_HARDIS_POOL_ENCRYPTION_KEY: ${{ secrets.SFDX_HARDIS_POOL_ENCRYPTION_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Set the repository variable CI_DELETE_SCRATCH_ORG to "false" only to investigate issues
      CI_DELETE_SCRATCH_ORG: ${{ vars.CI_DELETE_SCRATCH_ORG || 'true' }}
      SFDX_TEST_WAIT_MINUTES: ${{ vars.SFDX_TEST_WAIT_MINUTES || '120' }}
      FORCE_COLOR: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Create scratch org (or take it from the pool)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sf hardis:auth:login --devhub
          sf hardis:scratch:create
      - name: Run Apex tests
        run: |
          sleep 120 # A scratch org that was just created can be not ready yet
          sf hardis:org:test:apex
      # Skipped when a previous step failed, so the scratch org can be investigated until it expires
      - name: Delete scratch org
        if: ${{ success() && env.CI_DELETE_SCRATCH_ORG != 'false' }}
        run: sf org delete scratch --no-prompt || true
      - name: Archive sfdx-hardis reports
        if: always() # Also when the job was stopped by the timeout
        uses: actions/upload-artifact@v4
        with:
          name: sfdx-hardis scratch org reports
          path: hardis-report
