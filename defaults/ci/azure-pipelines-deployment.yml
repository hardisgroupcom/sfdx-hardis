# Pipeline for Salesforce deployment check & MegaLinter check
#
# This pipeline is triggered when a commit is added to a Pull Request
#
# This means the Pull Request should already exist before commiting your work or you'll have to push an empty commit
# to trigger the pipeline.
#
# Setup:
#   - Go to Pipelines
#   - Select or create a new pipeline (you may have to Create new -> Existing Azure Pipelines YAML file)
#   - Edit this new pipeline
#   - Add your variables in the "variables" section and tick "Keep this value secret"

#  /!\ This part is only for deployment pipeline

#   - Go to Pipelines and select your pipeline then Edit it
#   - Open the menu ⋮ and select Triggers
#   - In "Branch filters", tick "Override the YAML continuous integration trigger from here"
#   - "Include" all your major branches

name: Deploy to org

# Mandatory variables, used by jobs
variables:
  - name: FORCE_COLOR
    value: "1"
  - name: BRANCH_NAME
    value: $[replace(variables['Build.SourceBranch'], 'refs/heads/', '')]

jobs:
  # Deploy source with SFDX
  - job: Deployment
    timeoutInMinutes: 150
    pool:
      vmImage: ubuntu-latest
    # Job runs in sfdx-hardis docker image, that includes Salesforce CLI and all required plugins & dependencies.
    # You can use latest, beta or a version number (ex: v7.23.0), and pin a version if you need reproducible runs.
    # Images are also mirrored on Docker Hub, if your infrastructure can only pull from docker.io: hardisgroupcom/sfdx-hardis-ubuntu:latest
    # To use coding agents for auto-fix of deployment errors, use image ghcr.io/hardisgroupcom/sfdx-hardis-ubuntu-with-agents:latest
    container: ghcr.io/hardisgroupcom/sfdx-hardis-ubuntu:latest
    steps:
      # Checkout repo
      - checkout: self
        fetchDepth: 0
        persistCredentials: true
        displayName: Git Checkout

      # Login & Deploy sfdx sources to related org (configuration: https://hardisgroupcom.github.io/sfdx-hardis/salesforce-ci-cd-setup-auth/ )
      - script: |
          if [ "${BRANCH_NAME#auto-fix/}" != "${BRANCH_NAME}" ]; then
            echo "[sfdx-hardis] Skipping sf hardis commands on auto-fix branch ${BRANCH_NAME}"
            exit 0
          fi
          # Uncomment the lines below to allow coding agents to push auto-fix branches and create Pull Requests
          # (also requires the sfdx-hardis-ubuntu-with-agents image, an AI API key in the variables below,
          # and "Contribute" + "Create branch" permissions for the Build Service user on the repository)
          # if [ -n "${SYSTEM_ACCESSTOKEN:-}" ]; then
          #   git config user.email "sfdx-hardis-bot@cloudity.com"
          #   git config user.name "sfdx-hardis Bot"
          #   echo "[sfdx-hardis] Azure push/PR auth enabled for coding agents via SYSTEM_ACCESSTOKEN"
          # fi
          sf hardis:auth:login
          sf hardis:project:deploy:smart
        env:
          SFDX_CLIENT_ID_INTEGRATION: $(SFDX_CLIENT_ID_INTEGRATION)
          SFDX_CLIENT_KEY_INTEGRATION: $(SFDX_CLIENT_KEY_INTEGRATION)
          CI_COMMIT_REF_NAME: $(BRANCH_NAME)
          CONFIG_BRANCH: $(BRANCH_NAME)
          ORG_ALIAS: $(BRANCH_NAME)
          SLACK_TOKEN: $(SLACK_TOKEN)
          SLACK_CHANNEL_ID: $(SLACK_CHANNEL_ID)
          NOTIF_EMAIL_ADDRESS: $(NOTIF_EMAIL_ADDRESS)
          GENERIC_TICKETING_PROVIDER_REGEX: $(GENERIC_TICKETING_PROVIDER_REGEX)
          GENERIC_TICKETING_PROVIDER_URL_BUILDER: $(GENERIC_TICKETING_PROVIDER_URL_BUILDER)
          JIRA_HOST: $(JIRA_HOST)
          JIRA_EMAIL: $(JIRA_EMAIL)
          JIRA_TOKEN: $(JIRA_TOKEN)
          JIRA_PAT: $(JIRA_PAT)
          JIRA_TICKET_REGEX: $(JIRA_TICKET_REGEX)
          SFDX_DEPLOY_WAIT_MINUTES: $(SFDX_DEPLOY_WAIT_MINUTES)
          SFDX_AUTH_URL_TECHNICAL_ORG: $(SFDX_AUTH_URL_TECHNICAL_ORG)
          CI: "true"
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          CI_SFDX_HARDIS_AZURE_TOKEN: $(System.AccessToken)
          SYSTEM_COLLECTIONURI: $(System.CollectionUri)
          SYSTEM_TEAMPROJECT: $(System.TeamProject)
          SYSTEM_JOB_DISPLAY_NAME: $(System.JobDisplayName)
          SYSTEM_JOB_ID: $(System.JobId)
          SYSTEM_PULLREQUEST_PULLREQUESTID: $(System.PullRequest.PullRequestId)
          BUILD_REPOSITORY_ID: $(Build.Repository.ID)
          BUILD_REPOSITORYNAME: $(Build.Repository.Name)
          BUILD_SOURCEBRANCHNAME: $(Build.SourceBranchName)
          BUILD_BUILD_ID: $(Build.BuildId)
        displayName: "Deploy sources to related SF Org"
      # Publish sfdx-hardis reports, including the complete deployment result JSON
      # continueOnError: the folder is not created when there is nothing to deploy
      # (empty delta package.xml), and the publish task hard-fails on a missing path
      - publish: $(System.DefaultWorkingDirectory)/hardis-report/
        condition: succeededOrFailed()
        continueOnError: true
        artifact: hardis-report
        displayName: Publish sfdx-hardis reports
