site_name: Salesforce Project Documentation
site_url: https://sfdx-hardis.cloudity.com
repo_url: https://github.com/hardisgroupcom/sfdx-hardis
edit_uri: tree/master/docs
site_author: Nicolas Vuillamy
site_description: Salesforce project documentation generated by sfdx-hardis
copyright: Doc generated by <a href="https://sfdx-hardis.cloudity.com/" target="_blank">sfdx-hardis</a>, provided by <a href="https://cloudity.com/" target="_blank">Cloudity</a>
theme:
  name: material
  icon:
    logo: material/infinity
  # logo: assets/images/cloudity-text-logo.svg
  # favicon: assets/images/cloudity-logo.svg
  custom_dir: docs/overrides
  features:
    - navigation.instant
    - navigation.footer
    # A project documentation holds thousands of pages, and every one of them used to embed the
    # whole menu: 900 KB of navigation markup around 30 KB of content. Pruning it to the branch
    # being read is what keeps the site usable.
    - navigation.prune
    - navigation.path
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
      background: '#FFFFFF'
      foreground: '#001135'
      colors:
        primary: '#0053FF'
        accent: '#6A00FF'
        link: '#0053FF'
        header: '#001135'
        nav: '#FAF7FF'
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
      background: '#050B1F'
      foreground: '#FFFFFF'
      colors:
        primary: '#4D8BFF'
        accent: '#9B6BFF'
        link: '#4D8BFF'
        header: '#001135'
        nav: '#0A162E'
# Zensical ships its own search engine. It has no glob-based exclusion yet, so noisy
# generated pages opt out of the index with "search: exclude: true" front matter.
plugins:
  - search
markdown_extensions:
  - pymdownx.emoji:
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg
  - pymdownx.snippets:
      base_path: docs
      check_paths: true
      restrict_base_path: false
  - mdx_truly_sane_lists
  - attr_list
  # The home page section cards are markdown written inside div elements
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.4/jquery.min.js
  - https://cdnjs.cloudflare.com/ajax/libs/jstree/3.3.12/jstree.min.js
  - https://cdnjs.cloudflare.com/ajax/libs/tablesort/5.2.1/tablesort.min.js
  - javascripts/tables.js
  - javascripts/gtag.js
  - javascripts/jstree-handler.js
  # Rewritten by sfdx-hardis on every run: put project behavior in javascripts/tables.js
  - javascripts/sfdx-hardis-doc-labels.js
  - javascripts/sfdx-hardis-doc.js
extra_css:
  - stylesheets/extra.css
  - https://cdnjs.cloudflare.com/ajax/libs/jstree/3.3.12/themes/default/style.min.css
  # Loaded last so it overrides the project stylesheet: sfdx-hardis rewrites it on every run
  - stylesheets/sfdx-hardis-doc.css
extra:
  social:
    - icon: fontawesome/regular/circle-question
      link: https://github.com/hardisgroupcom/sfdx-hardis/issues
      name: Need help? Post an issue :)
    - icon: fontawesome/brands/github
      link: https://github.com/hardisgroupcom/sfdx-hardis
    - icon: fontawesome/solid/infinity
      link: https://cloudity.com/
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/NicolasVuillamy
  generator: false
nav:
  - "Home": "index.md"
