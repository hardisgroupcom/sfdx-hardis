# Configuration file for Mega-Linter
# See all available variables at https://megalinter.io/latest/config-file/ and in linters documentation
EXTENDS:
  - https://raw.githubusercontent.com/hardisgroupcom/sfdx-hardis/main/config/sfdx-hardis.mega-linter-config.yml

DISABLE_ERRORS_LINTERS:
  - CSS_STYLELINT
  - COPYPASTE_JSCPD
  - SALESFORCE_SFDX_SCANNER_APEX
  - SALESFORCE_SFDX_SCANNER_AURA
  - SALESFORCE_SFDX_SCANNER_LWC

# The monitoring jobs run the latest sfdx-hardis image on purpose, so that every night uses the
# latest checks: the image tag checks do not apply to these templates
REPOSITORY_CHECKOV_ARGUMENTS:
  - --skip-check
  - CKV_AZUREPIPELINES_1,CKV_AZUREPIPELINES_2,CKV_BITBUCKETPIPELINES_1
