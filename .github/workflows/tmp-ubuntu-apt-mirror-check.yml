# Temporary workflow: checks the apt mirror fallback of Dockerfile-ubuntu.
# Remove it before merging.
name: Temporary Ubuntu apt mirror check
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ubuntu-image:
    name: Build Ubuntu image (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu archive as usual (fallback only if the runner cannot reach it)
          - mode: default
            add-hosts: ""
          # Ubuntu archive hosts pointed at an address that does not answer: the fallback mirror must be used
          - mode: forced-fallback
            add-hosts: |
              archive.ubuntu.com:0.0.0.0
              security.ubuntu.com:0.0.0.0
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build Docker Ubuntu image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile-ubuntu
          platforms: linux/amd64
          build-args: |
            SFDX_HARDIS_VERSION=beta
            SFDX_CLI_VERSION=latest
          add-hosts: ${{ matrix.add-hosts }}
          load: true
          push: false
          tags: |
            sfdx-hardis-ubuntu:apt-mirror-check

      - name: Check the tools in the image
        run: |
          set -euo pipefail
          image=sfdx-hardis-ubuntu:apt-mirror-check
          docker run --rm "$image" node --version
          docker run --rm "$image" java -version
          docker run --rm "$image" docker --version
          docker run --rm "$image" git --version
          timeout 180 docker run --rm "$image" sf --version
          timeout 180 docker run --rm "$image" sf hardis --help > /dev/null
          echo "Image OK"
