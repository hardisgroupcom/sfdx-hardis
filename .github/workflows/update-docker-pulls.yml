---
name: "Update Docker Pulls Badge"

on:
  schedule:
    # Every Monday at 04:00 UTC
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-docker-pulls:
    name: Aggregate Docker pulls and refresh badge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Aggregate Docker pull counts and update badge
        run: node scripts/update-docker-pulls.mjs
      - name: Open a pull request with the badge update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          BASE_BRANCH: ${{ github.ref_name }}
        run: |
          git add README.md docs/index.md
          if git diff --cached --quiet; then
            echo "Docker pulls badge already up to date, nothing to do"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="chore/update-docker-pulls-${RUN_ID}"
          git checkout -b "$BRANCH"
          git commit -m "chore(docs): refresh aggregated Docker pulls badge"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git" "HEAD:$BRANCH"
          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$BRANCH" \
            --title "chore(docs): refresh aggregated Docker pulls badge" \
            --body "Automated weekly refresh of the aggregated Docker Pulls badge (Docker Hub + ghcr.io across all sfdx-hardis images). Generated by the \`Update Docker Pulls Badge\` workflow."
