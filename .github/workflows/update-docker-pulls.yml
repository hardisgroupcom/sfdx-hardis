---
name: "Update Docker Pulls Badge"

on:
  schedule:
    # Every Monday at 04:00 UTC
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-docker-pulls:
    name: Aggregate Docker pulls and refresh badge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Aggregate Docker pull counts and update badge
        run: node scripts/update-docker-pulls.mjs
      - name: Commit and push badge update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md docs/index.md
          if git diff --cached --quiet; then
            echo "Docker pulls badge already up to date, nothing to commit"
          else
            git commit -m "chore(docs): refresh aggregated Docker pulls badge"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" "HEAD:${{ github.ref_name }}"
          fi
