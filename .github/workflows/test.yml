name: tests
on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: read-all

# Avoid duplicate runs when push + pull_request fire for the same branch.
# Key on branch name so both events share a group (head_ref is the PR branch
# on pull_request, ref_name is the branch on push); falling back to ref makes
# manual workflow_dispatch runs cancellable too.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name || github.ref }}
  cancel-in-progress: true

jobs:
  linux-unit-tests:
    uses: salesforcecli/github-workflows/.github/workflows/unitTestsLinux.yml@main # zizmor: ignore[unpinned-uses]
    permissions:
      contents: read
      checks: write
    with:
      skipTsDepCheck: true

  windows-unit-tests:
    uses: salesforcecli/github-workflows/.github/workflows/unitTestsWindows.yml@main # zizmor: ignore[unpinned-uses]
    permissions:
      contents: read
      checks: write

  nuts:
    needs:
      - linux-unit-tests
      - windows-unit-tests
    uses: salesforcecli/github-workflows/.github/workflows/nut.yml@main # zizmor: ignore[unpinned-uses]
    secrets: inherit # zizmor: ignore[secrets-inherit]
    permissions:
      contents: read
      checks: write
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
      fail-fast: false
    with:
      os: ${{ matrix.os }}
