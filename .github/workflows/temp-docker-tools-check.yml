# TEMPORARY - remove before merging the Pull Request that adds it.
# Checks that Mermaid and Zensical still work in the Docker images now that they hold the docker
# client only (no engine) and a Java runtime instead of the JDK: the images run as CI jobs do, with
# the docker socket of the host mounted, and the work folder mounted at the same path, because the
# host daemon resolves the `docker run -v` paths that sfdx-hardis passes from inside the container.
name: TEMP Docker tools check
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-package:
    name: Prepare local plugin package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build from sources
        run: yarn compile

      - name: Package current sources
        run: yarn pack --filename sfdx-hardis-local.tgz

      - name: Upload packaged plugin
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sfdx-hardis-local-tools-check
          path: sfdx-hardis-local.tgz

  tools-check:
    name: Mermaid and Zensical (${{ matrix.flavor }})
    needs: prepare-package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: alpine
            dockerfile: Dockerfile
            published: ghcr.io/hardisgroupcom/sfdx-hardis:latest
            # The Alpine image documents that mermaid-cli does not run there: docker mode only
            mermaid_cli: "false"
          - flavor: ubuntu
            dockerfile: Dockerfile-ubuntu
            published: ghcr.io/hardisgroupcom/sfdx-hardis-ubuntu:latest
            mermaid_cli: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download packaged plugin
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sfdx-hardis-local-tools-check

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          build-args: |
            SFDX_HARDIS_VERSION=latest
            SFDX_HARDIS_TGZ=sfdx-hardis-local.tgz
            SFDX_CLI_VERSION=latest
          load: true
          push: false
          tags: |
            sfdx-hardis-tools-check:${{ matrix.flavor }}

      - name: Check Mermaid and Zensical in the image
        env:
          IMAGE: sfdx-hardis-tools-check:${{ matrix.flavor }}
          MERMAID_CLI: ${{ matrix.mermaid_cli }}
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/tools-check"
          mkdir -p "$W/flows" "$W/out-docker" "$W/out-cli" "$W/site-local/docs" "$W/site-docker/docs"

          cat > "$W/flows/Tools_Check.flow-meta.xml" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <Flow xmlns="http://soap.sforce.com/2006/04/metadata">
              <apiVersion>65.0</apiVersion>
              <assignments>
                  <name>Set_Greeting</name>
                  <label>Set Greeting</label>
                  <locationX>176</locationX>
                  <locationY>134</locationY>
                  <assignmentItems>
                      <assignToReference>greeting</assignToReference>
                      <operator>Assign</operator>
                      <value>
                          <stringValue>Hello</stringValue>
                      </value>
                  </assignmentItems>
              </assignments>
              <label>Tools Check</label>
              <processType>AutoLaunchedFlow</processType>
              <start>
                  <locationX>50</locationX>
                  <locationY>0</locationY>
                  <connector>
                      <targetReference>Set_Greeting</targetReference>
                  </connector>
              </start>
              <status>Active</status>
              <variables>
                  <name>greeting</name>
                  <dataType>String</dataType>
                  <isCollection>false</isCollection>
                  <isInput>false</isInput>
                  <isOutput>false</isOutput>
              </variables>
          </Flow>
          EOF
          for site in site-local site-docker; do
            printf 'site_name: Tools check\n' > "$W/$site/mkdocs.yml"
            printf '# Tools check\n\nBuilt with Zensical.\n' > "$W/$site/docs/index.md"
          done
          # Calls the generateMkDocsHTML() of the installed plugin: no command builds a site without Cloudflare or an org
          cat > "$W/zensical-build.sh" <<'EOF'
          set -euo pipefail
          DOC_UTILS=$(find / -path /proc -prune -o -path '*/node_modules/sfdx-hardis/lib/common/docBuilder/docUtils.js' -print 2>/dev/null | head -1)
          echo "docUtils: $DOC_UTILS"
          node --input-type=module -e "const m = await import('file://$DOC_UTILS'); await m.generateMkDocsHTML();"
          EOF

          cat > "$W/tools.sh" <<'EOF'
          set -euo pipefail
          docker --version
          java -version
          command -v keytool
          docker info --format "Host daemon: {{.ServerVersion}}"
          echo "MERMAID_MODES=${MERMAID_MODES:-}"
          EOF

          # The mermaid-cli and zensical images run as another user than the sfdx-hardis container (root)
          # and the runner: open the folders, and create files with umask 000 so they can overwrite them
          chmod -R a+rwX "$W"

          # Usage: in_image [docker run options] -- command...
          in_image() {
            local opts=()
            while [ "$1" != "--" ]; do opts+=("$1"); shift; done
            shift
            # shellcheck disable=SC2016 # expanded by the bash of the container
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$W:$W" -w "$W" "${opts[@]}" "$IMAGE" bash -c 'umask 000; exec "$@"' _ "$@"
          }

          echo "== Tools in the image =="
          in_image -- bash "$W/tools.sh"

          echo "== Mermaid with MERMAID_MODES=docker =="
          in_image -e MERMAID_MODES=docker -- sf hardis:doc:flow2markdown --inputfile flows/Tools_Check.flow-meta.xml --outputfile out-docker/Tools_Check.md --agent
          ls -la "$W/out-docker"
          ls "$W"/out-docker/*.svg
          grep -q "Tools_Check-1.svg" "$W/out-docker/Tools_Check.md"

          if [ "$MERMAID_CLI" = "true" ]; then
            echo "== Mermaid with MERMAID_MODES=cli =="
            in_image -e MERMAID_MODES=cli -- sf hardis:doc:flow2markdown --inputfile flows/Tools_Check.flow-meta.xml --outputfile out-cli/Tools_Check.md --agent
            ls -la "$W/out-cli"
            ls "$W"/out-cli/*.svg
            grep -q "Tools_Check-1.svg" "$W/out-cli/Tools_Check.md"
          fi

          echo "== Zensical (default: local pip install, docker when it fails) =="
          in_image -w "$W/site-local" -- bash "$W/zensical-build.sh" 2>&1 | tee "$W/zensical-local.log"
          test -f "$W/site-local/site/index.html"

          echo "== Zensical forced to docker (pip cannot reach an index) =="
          in_image -w "$W/site-docker" -e PIP_INDEX_URL=http://127.0.0.1:9/simple -e PIP_RETRIES=0 -e PIP_TIMEOUT=2 -- bash "$W/zensical-build.sh" 2>&1 | tee "$W/zensical-docker.log"
          grep -q "Generating HTML pages with Docker" "$W/zensical-docker.log"
          test -f "$W/site-docker/site/index.html"

      - name: Compare the image size with the published one
        env:
          IMAGE: sfdx-hardis-tools-check:${{ matrix.flavor }}
          PUBLISHED: ${{ matrix.published }}
          FLAVOR: ${{ matrix.flavor }}
        run: |
          set -euo pipefail
          docker pull --quiet "$PUBLISHED"
          new_mb=$(( $(docker image inspect -f '{{.Size}}' "$IMAGE") / 1000000 ))
          old_mb=$(( $(docker image inspect -f '{{.Size}}' "$PUBLISHED") / 1000000 ))
          {
            echo "### Image size ($FLAVOR, uncompressed)"
            echo ""
            echo "| Image | Size |"
            echo "|---|---|"
            echo "| Published \`$PUBLISHED\` | ${old_mb} MB |"
            echo "| This Pull Request | ${new_mb} MB |"
            echo "| Saved | $(( old_mb - new_mb )) MB |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
