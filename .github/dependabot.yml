version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
    # Wait for a new version to have been public for a week before proposing it: a compromised
    # release published through a supply chain attack is usually detected and pulled within days.
    # Cooldown applies to version updates only: Dependabot security updates (CVE) are exempt and
    # are still proposed as soon as the advisory is published.
    cooldown:
      default-days: 7
      include:
        - '*'
    versioning-strategy: 'increase'
    labels:
      - 'dependencies'
    open-pull-requests-limit: 5
    pull-request-branch-name:
      separator: '-'
    commit-message:
      # cause a release for non-dev-deps
      prefix: fix(deps)
      # no release for dev-deps
      prefix-development: chore(dev-deps)
    ignore:
      - dependency-name: '@salesforce/dev-scripts'
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
