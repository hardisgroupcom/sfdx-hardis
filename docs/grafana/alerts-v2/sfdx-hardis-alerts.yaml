# Grafana alert rules for "Org Monitoring by sfdx-hardis" (v2)
#
# All rules ship PAUSED (isPaused: true) so importing them costs nothing on
# Grafana Cloud free tier. Enable the ones you want from Alerting > Alert rules,
# and configure your own contact points / notification policies.
#
# Before importing, replace the datasource placeholders with your datasource UIDs:
#   ${DS_PROMETHEUS} -> your Prometheus/Mimir datasource uid (e.g. grafanacloud-prom)
#   ${DS_LOKI}       -> your Loki datasource uid (e.g. grafanacloud-logs)
# Find the UIDs in Grafana: Connections > Data sources > (datasource) > the uid is in the URL.
#
# Import: place this file in your Grafana provisioning/alerting folder (self-hosted),
# or POST it through the Grafana HTTP API / import it with Grafana Terraform provider.
# See https://sfdx-hardis.cloudity.com/salesforce-monitoring-grafana-v2/
apiVersion: 1
groups:
  - orgId: 1
    name: sfdx-hardis-org-monitoring
    folder: Org Monitoring by sfdx-hardis
    interval: 6h
    rules:
      # ----------------------------------------------------------------------
      # 1. Any org limit above 90%
      # ----------------------------------------------------------------------
      - uid: sfdx-hardis-v2-limit-above-90
        title: Salesforce org limit above 90%
        condition: C
        isPaused: true
        for: 0s
        noDataState: OK
        execErrState: OK
        labels:
          source: sfdx-hardis
        annotations:
          summary: 'Org {{ $labels.orgIdentifier }} has at least one limit above 90% usage'
        data:
          - refId: A
            relativeTimeRange:
              from: 259200
              to: 0
            datasourceUid: ${DS_PROMETHEUS}
            model:
              refId: A
              instant: true
              range: false
              expr: 'max by (orgIdentifier) (last_over_time({__name__=~".+_percent", source="sfdx-hardis"}[2d]))'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    params: [90]
                    type: gt
      # ----------------------------------------------------------------------
      # 2. Storage projected full within 14 days (30d linear trend)
      # ----------------------------------------------------------------------
      - uid: sfdx-hardis-v2-storage-forecast
        title: Salesforce storage projected full within 14 days
        condition: C
        isPaused: true
        for: 0s
        noDataState: OK
        execErrState: OK
        labels:
          source: sfdx-hardis
        annotations:
          summary: 'Org {{ $labels.orgIdentifier }}: data or file storage is trending toward 100% in less than 14 days'
        data:
          - refId: A
            relativeTimeRange:
              from: 2678400
              to: 0
            datasourceUid: ${DS_PROMETHEUS}
            model:
              refId: A
              instant: true
              range: false
              expr: >-
                ((100 - last_over_time(DataStorageMB_percent{source="sfdx-hardis"}[2d]))
                / clamp_min(deriv(DataStorageMB_percent{source="sfdx-hardis"}[30d]) * 86400, 0.000001) < 14)
                or
                ((100 - last_over_time(FileStorageMB_percent{source="sfdx-hardis"}[2d]))
                / clamp_min(deriv(FileStorageMB_percent{source="sfdx-hardis"}[30d]) * 86400, 0.000001) < 14)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
      # ----------------------------------------------------------------------
      # 3. Apex + Flow error spike (more than 2x the 7-day average + 5)
      # ----------------------------------------------------------------------
      - uid: sfdx-hardis-v2-error-spike
        title: Salesforce Apex/Flow error spike
        condition: C
        isPaused: true
        for: 0s
        noDataState: OK
        execErrState: OK
        labels:
          source: sfdx-hardis
        annotations:
          summary: 'Org {{ $labels.orgIdentifier }}: Apex + Flow errors exceed twice their 7-day average'
        data:
          - refId: A
            relativeTimeRange:
              from: 691200
              to: 0
            datasourceUid: ${DS_PROMETHEUS}
            model:
              refId: A
              instant: true
              range: false
              expr: >-
                (sum by (orgIdentifier) (last_over_time(ApexErrors_metric{source="sfdx-hardis"}[1d]))
                + sum by (orgIdentifier) (last_over_time(FlowErrors_metric{source="sfdx-hardis"}[1d])))
                >
                ((2 * (sum by (orgIdentifier) (avg_over_time(ApexErrors_metric{source="sfdx-hardis"}[7d]))
                + sum by (orgIdentifier) (avg_over_time(FlowErrors_metric{source="sfdx-hardis"}[7d])))) + 5)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
      # ----------------------------------------------------------------------
      # 4. Metadata backup failed in the last 26 hours
      # ----------------------------------------------------------------------
      - uid: sfdx-hardis-v2-backup-failed
        title: Salesforce metadata backup failed
        condition: C
        isPaused: true
        for: 0s
        noDataState: OK
        execErrState: OK
        labels:
          source: sfdx-hardis
        annotations:
          summary: 'Org {{ $labels.orgIdentifier }}: metadata backup reported an error in the last 26 hours'
        data:
          - refId: A
            relativeTimeRange:
              from: 93600
              to: 0
            datasourceUid: ${DS_LOKI}
            model:
              refId: A
              queryType: instant
              expr: 'sum by (orgIdentifier) (count_over_time({source="sfdx-hardis", type="BACKUP", severity=~"error|critical"}[26h]))'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
      # ----------------------------------------------------------------------
      # 5. Silent org: seen in the last 7 days but nothing for 36 hours
      # ----------------------------------------------------------------------
      - uid: sfdx-hardis-v2-silent-org
        title: Salesforce org monitoring is silent
        condition: C
        isPaused: true
        for: 0s
        noDataState: OK
        execErrState: OK
        labels:
          source: sfdx-hardis
        annotations:
          summary: 'Org {{ $labels.orgIdentifier }} sent no monitoring notification for 36 hours: the monitoring job probably failed'
        data:
          - refId: A
            relativeTimeRange:
              from: 604800
              to: 0
            datasourceUid: ${DS_LOKI}
            model:
              refId: A
              queryType: instant
              expr: >-
                (sum by (orgIdentifier) (count_over_time({source="sfdx-hardis"}[7d])) > 0)
                unless
                (sum by (orgIdentifier) (count_over_time({source="sfdx-hardis"}[36h])) > 0)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
      # ----------------------------------------------------------------------
      # 6. Health score low (< 60) or dropped by more than 20 points
      # ----------------------------------------------------------------------
      - uid: sfdx-hardis-v2-health-score
        title: Salesforce org health score degraded
        condition: C
        isPaused: true
        for: 0s
        noDataState: OK
        execErrState: OK
        labels:
          source: sfdx-hardis
        annotations:
          summary: 'Org {{ $labels.orgIdentifier }}: health score below 60 or dropped by more than 20 points'
        data:
          - refId: A
            relativeTimeRange:
              from: 1382400
              to: 0
            datasourceUid: ${DS_PROMETHEUS}
            model:
              refId: A
              instant: true
              range: false
              expr: >-
                (last_over_time(HealthScore_metric{source="sfdx-hardis"}[8d]) < 60)
                or
                ((last_over_time(HealthScore_metric{source="sfdx-hardis"}[8d] offset 1d)
                - last_over_time(HealthScore_metric{source="sfdx-hardis"}[8d])) > 20)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
