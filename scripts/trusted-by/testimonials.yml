# Testimonials of the "Trusted by" block of the documentation site.
#
# node build.cjs (run by the pre-commit hook and by yarn build) reads this file and writes:
#   - the logo grid between the <!-- trusted-by:start --> and <!-- trusted-by:end --> markers of
#     README.md, docs/index.md and docs/salesforce-devops-home.md
#   - docs/assets/trusted-by.json, the cards that docs/javascripts/trusted-by.js turns into a carousel
#   - docs/trusted-by.md, the page listing every testimonial, and its menu entry in mkdocs.yml
# Until 3 real testimonials are approved, the markers stay empty, and the page and its menu entry are
# removed (MIN_TESTIMONIALS in build-trusted-by.cjs).
#
# This repository is public: an entry is readable on GitHub as soon as it is pushed, approved or not.
# Push an entry only once the customer agreed to be listed.
#
# Fields:
#   customer   (required) Company name, used in the logo alt text and under the logo in the README.
#   website    (required) https:// URL the logo links to.
#   logo       (required) File in docs/assets/images/trusted-by/, .svg or .png.
#   person     (required) Name of the person who gave the testimony.
#   role       (required) Role of the person.
#   photo      (optional) File in docs/assets/images/trusted-by/ (.svg, .png, .jpg, .jpeg or .webp).
#              Any shape: the site shows it as a small circle.
#   quote      (required) What they like about sfdx-hardis, 40 words at most (the build warns above).
#              Keep it between double quotes: a colon in the text breaks the file otherwise.
#   featured   (optional) true to always show it first. The other entries are shuffled on each load.
#   approved   (required to be shown) true once the customer validated the logo, the photo and the quote.
#   example    (optional) true for a made-up placeholder, shown only in a local preview.
#
# Made-up examples (example: true) never reach the README nor the published site:
#   - yarn build:trusted-by:examples   shows them, to preview the site locally (python -m zensical serve)
#   - yarn build:trusted-by            removes them again. The pre-commit hook refuses a commit that
#                                      still holds them, and the docs deployment removes them anyway.
# Replace them with real customers: the block appears on the site with the third real approved entry.

testimonials:
