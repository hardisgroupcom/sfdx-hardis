command: hardis:datacloud:sql-query
run: 'sf hardis:datacloud:sql-query --query "SELECT ssot__Name__c, ssot__CreatedDate__c FROM ssot__Account__dlm ORDER BY ssot__CreatedDate__c DESC LIMIT 10"'
