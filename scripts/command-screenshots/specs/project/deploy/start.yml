command: hardis:project:deploy:start
run: sf hardis:project:deploy:start --source-dir force-app --test-level RunLocalTests
org: throwaway
# A draft of deployment actions not assigned to a Pull Request stops any deployment
before: git rm -q scripts/actions/.sfdx-hardis.draft.yml && git commit -qm "HEL-42 Drop the draft deployment actions" && sf project reset tracking --target-org hardis-shots-throwaway --no-prompt
caption: The Helios sources deployed with sf project deploy start, with the deployment actions and Pull Request comments of sfdx-hardis around it
